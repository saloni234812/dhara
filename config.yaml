facility:
  name: "District Civil Hospital, Ramnagar"
  beds: 300
  type: "Government District Hospital"
  location: "Uttar Pradesh, India"
  coordinates: [26.8467, 80.9462] # Center coordinates for campus map

tariffs_and_factors:
  electricity_tariff_inr_kwh: 8.50   # Commercial / Institutional slab (₹/kWh)
  water_tariff_inr_kl: 25.00          # Municipal water tariff (₹ per 1,000 Liters)
  waste_disposal_cost_inr_kg: 12.00   # Haulage and treatment cost
  emission_factor_kg_co2_kwh: 0.75    # Grid emission factor (kg CO2e/kWh) - CEA Version 19
  emission_factor_source: "Central Electricity Authority (CEA) CO2 Baseline Database v19 (Default: 0.75 kg CO2/kWh; verify latest CEA figure)"

weights:
  scorecard:
    energy: 0.35
    water: 0.25
    waste: 0.20
    air: 0.20
  priority:
    savings: 0.40
    urgency: 0.35
    ease_of_fix: 0.25

thresholds:
  energy:
    night_baseline_multiplier: 1.5
    anomaly_contamination: 0.05
    zscore_warning: 2.0
    zscore_critical: 3.0
  water:
    night_flow_window_hours: [2, 3, 4] # 2 AM - 4 AM baseline check
    night_flow_leak_multiplier: 2.2
    rolling_window_hours: 24
    zscore_leak: 2.5
  waste:
    bin_capacity_liters: 240
    overflow_warning_pct: 75.0
    overflow_critical_pct: 90.0
    bmw_max_storage_hours: 48 # Bio-Medical Waste Management Rules, 2016
  air:
    cpcb_standards:
      pm25_good: 30
      pm25_moderate: 60
      pm25_poor: 90
      pm25_very_poor: 120
      pm10_moderate: 100
      pm10_poor: 250
    hotspot_min_consecutive_hours: 3

